[package]
name = "directory"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Dérive et signe le servers.json public depuis le manifeste serveur (tessera-directory)"

[dependencies]
server = { path = "../server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rand = "0.8"
reqwest = { version = "0.12", features = ["blocking", "json"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "tessera-directory"
path = "src/main.rs"
