; Réglages moteur de population — lus par le jeu au chargement, s'appliquent à TOUTE la carte,
; pas réinitialisés par le streaming (contrairement aux appels runtime type
; CommunitySystem.ChangeDensityModifier, cf. DesossagePopulation.reds).
;
; ─────────────────────────────────────────────────────────────────────────────────────────────
; RÉACTIVÉ le 2026-07-21 — application de la doctrine « intercepter, pas détruire » (CLAUDE.md).
; ─────────────────────────────────────────────────────────────────────────────────────────────
;
; Historique : ces trois clés étaient à `false` depuis le 2026-07-06 pour obtenir la « map nue »
; (confirmé en jeu par Lucas, v2.31 : plus aucun piéton ni véhicule avec ce fichier seul).
; C'était efficace, mais c'est exactement le type de coupure que la doctrine écarte désormais :
; un interrupteur moteur qui supprime en bloc, sans point d'interception, et sans qu'on comprenne
; le mécanisme qu'il faudra de toute façon reproduire côté serveur.
;
; On les remet à `true` pour pouvoir OBSERVER la foule et le trafic, comprendre par où ils sont
; spawnés et trouver leur point d'entrée interceptable — plutôt que de les faire disparaître et
; de découvrir en playtest ce qu'on avait perdu.
;
; ⚠️ Conséquence immédiate : la map n'est plus nue. Tant que l'interception n'est pas en place,
; une session verra les piétons et le trafic vanilla. C'est VOULU pendant la phase de sondage,
; ce n'est pas un retour en arrière.
;
; Pour retrouver la map nue le temps d'un test : repasser les trois clés à `false`. Réversible en
; une ligne — c'est précisément ce que la doctrine demande de préserver.
;
; Ajouter ici toute autre section confirmée réelle (source : fichier ini effectif d'un mod publié,
; jamais deviné — cf. mémoire persistante feedback-nexus-mods-ask-lucas).

[Crowd]
Enabled = true
EnablePedestrians = true
EnableVehicles = true
</content>
