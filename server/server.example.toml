format_version = 1

[identity]
id = "tessera-dev-01"
name = "Tessera Dev — Night City"
description = "Serveur de développement TesseraSynth (serveur Rust autoritaire, GameNetworkingSockets). Tranche verticale 0-D."
region = "EU"
language = "FR"
max_players = 16
tags = ["dev", "test"]
discord_url = ""
website_url = "https://tesserasynth.net"
required_modset = "0.1.0-dev10"
voice_required = false

# "official" | "community" — défaut "community" si absent. Seuls les serveurs de l'opérateur
# du projet déclarent "official" explicitement.
# kind = "community"
# "dev" | "playtest" | "release" — défaut "release" si absent (aucun badge affiché côté
# launcher pour ce cas, un canal release ne se signale pas).
# channel = "release"

[runtime]
whitelist = false
store_path = "players.json"

# Point de spawn par défaut pour un joueur neuf (sans position/résidence connue). X/Y/Z = repère
# monde du jeu (GetWorldPosition brut, aucune transformation). Coordonnée Night City réelle et
# testée (zone de sauvegarde observée au playtest 2026-07-17). NE PAS laisser à [0,0,0] : ce serait
# l'origine du monde, et un joueur neuf y naîtrait (WARN au boot du Gateway). Remplace l'ancien
# default_entry du schéma BSP (disparu avec le Groupe G, câblage runtime Voronoï).
spawn = [-1431.17, 1302.27, 27.06]

[runtime.gateway]
listen_addr = "0.0.0.0:27020"
advertise_addr = "51.38.189.234:27020"

# Topologie d'autorité Voronoï (tools/authority-tessellation) : authority.json (copié à côté de
# ce manifeste) porte la géométrie des cellules ; server_count sélectionne le groupement
# assignment_patterns[N] de l'artefact (remplace l'ancien arbre de splits/shards).
[runtime.topology]
authority_artifact = "authority.json"
server_count = 2
# Une adresse `host:port` joignable par groupe, dans l'ordre des `--group-id` passés aux binaires
# `tessera-shard` : shard_addrs[i] sert le groupe i. Il en faut EXACTEMENT `server_count`, sinon
# le Gateway refuse de démarrer (un Gateway sans lien shard tourne à blanc en silence — incident
# du 2026-07-20). En Docker/Swarm : nom de service, jamais une IP de tâche.
shard_addrs = ["shard-a:27030", "shard-b:27031"]

[runtime.radius]
base = 25.0
moderator = 50.0
game_master = 75.0

[runtime.aoi]
visibility_radius = 100.0

# --- Population PNJ (fondation nav-indépendante, sous-projet PNJ, palier 2) ---
# Densité PNJ cible par district (clé = code de district, même convention que
# runtime.topology.radius_overrides). ABSENT ou vide = aucun PNJ simulé sur ce serveur (défaut sûr,
# comportement historique préservé pour tout manifeste existant). Un district sans joueur présent
# ne spawn JAMAIS de PNJ même sous sa cible (cf. population_director.rs) — ce n'est donc pas un
# "nombre garanti" mais un plafond atteint uniquement là où au moins un joueur observe la zone.
# NOTE fondation (Task 6) : le câblage réel ne raisonne encore que sur un district logique unique
# nommé "default" (pas la vraie topologie multi-district/authority.json) — seule une clé "default"
# a un effet aujourd'hui ; toute autre clé de district est acceptée par le parseur mais ignorée par
# le director tant que le câblage multi-district n'existe pas (plan de navigation, à venir).
#
# CURATION — liste de REJET (spec ambiance §4). Les archétypes du catalogue PNJ portent des tags
# (démographie/faction : corpo, homeless, child, nightlife, sexworker…). Tout archétype dont un tag
# figure ici n'est JAMAIS spawné. Modèle permissif : absent/vide = tout le catalogue est spawnable.
# ⚠️ TOML : `exclure_tags` est un champ de [runtime.population], il doit donc être déclaré AVANT
# d'ouvrir la sous-table [runtime.population.target_density] ci-dessous (sinon erreur de parse).
# Exemple (dé-commenter la ligne d'en-tête ET la clé) :
# [runtime.population]
# exclure_tags = ["child", "sexworker"]
[runtime.population.target_density]
# default = 20

# --- PNJ nominatifs (fondation d'interaction, sous-projet Phase 3.1, palier 2) ---
# Chemin (relatif au dossier du manifeste) vers un manifeste TOML de PNJ nominatifs — voir
# named-npc-catalog.example.toml pour le format. ABSENT = aucun PNJ nominatif sur ce serveur
# (défaut sûr, comportement historique préservé).
# ⚠️ MUTUELLEMENT EXCLUSIF avec [runtime.population] ci-dessus : Server::new_with_npcs (foule) et
# Server::new_with_named_npcs (nominatifs) sont deux constructeurs distincts qui ne peuvent pas
# cohabiter dans cette fondation — si les DEUX sont configurés, [runtime.population] est prioritaire
# et named_npc_manifest_path est silencieusement ignoré (voir shard.rs). Ne configurer qu'un seul
# des deux tant que le câblage combiné n'existe pas.
# named_npc_manifest_path = "named-npc-catalog.toml"

# --- Ascenseurs (modèle serveur, palier 2) ---
# Chemin du catalogue d'ascenseurs. ABSENT = aucun ascenseur simulé (défaut sûr).
# Le catalogue porte l'EntityID statique de chaque cabine, ses étages et ses durées — voir
# elevator-catalog.example.toml. Le serveur n'accepte JAMAIS un ascenseur annoncé par un client.
# Orthogonal à runtime.population/named_npc_manifest_path ci-dessus (pas d'exclusion mutuelle) :
# un serveur peut déclarer PNJ ET ascenseurs en même temps (Server::with_elevators s'ajoute au
# constructeur choisi pour les PNJ, cf. shard.rs).
# elevator_catalog_path = "elevator-catalog.toml"
