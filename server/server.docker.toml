format_version = 1

[identity]
id = "tessera-dev-01"
name = "Tessera Dev — Night City"
description = "Serveur de développement TesseraSynth (docker-compose, Gateway + 2 Shards)."
region = "EU"
language = "FR"
max_players = 16
tags = ["dev", "test"]
discord_url = ""
website_url = "https://tesserasynth.net"
required_modset = "0.2.0-dev.3"
voice_required = false
# Playtest 2 (2026-07-13+) : auth ZITADEL réelle exigée au Join (JWT vérifié), et bascule vers
# PostgresStore (voir bin/gateway.rs) — nécessite TESSERA_POSTGRES_URL posée côté Dokploy.
public = true

[runtime]
whitelist = false
store_path = "/data/players.json"

# Place gardée après une déconnexion SUBIE (voir `server.example.toml` pour l'arbitrage complet).
# Un départ volontaire la libère aussitôt. 0 = désactivé. Défaut si absent : 600.
reservation_seconds = 600

# Point de spawn par défaut pour un joueur neuf (sans position/résidence connue). X/Y/Z = repère
# monde du jeu (GetWorldPosition brut). Coordonnée Night City réelle et testée (zone de sauvegarde
# observée au playtest 2026-07-17). CRITIQUE : sans cette ligne, le défaut est [0,0,0] = l'origine
# du monde, où naissaient les joueurs neufs (bug P5, `placement décidé [0,0,0]` dans les logs live).
# Le Gateway logue désormais un WARN de boot si le spawn vaut [0,0,0].
spawn = [-1431.17, 1302.27, 27.06]

[runtime.gateway]
listen_addr = "0.0.0.0:27020"
advertise_addr = "51.38.189.234:27020"

# Topologie d'autorité Voronoï (tools/authority-tessellation) : authority.json (copié à côté de
# ce manifeste) porte la géométrie des cellules ; server_count sélectionne le groupement
# assignment_patterns[N] de l'artefact (remplace l'ancien arbre de splits/shards).
#
# server_count = 9 (2026-08-04, était 10 depuis le 2026-07-14, 2 avant) : toujours la granularité
# MAXIMALE de l'artefact (assignment_patterns["9"] = 1 cellule par groupe, aucune fusion),
# topologie statique/froide (§5.6/§7.5). Le passage de 10 à 9 n'est pas un choix de capacité :
# l'artefact lui-même est passé à 9 cellules quand le proxy de charge a reçu son plancher
# (`weight_area_floor`, voir tools/authority-tessellation/src/params.rs) — la ville se
# re-clusterise et `dense_seed_count` doit tomber à 6, sinon Downtown forme une cellule sous
# `r_min`. `assignment_patterns` n'a donc plus de clé "10" : laisser 10 ici ferait échouer le
# chargement au boot. Doit rester en phase avec le nombre de services `shard-*` de
# docker-compose.yml (9) et leurs `--group-id` 0-8.
[runtime.topology]
authority_artifact = "authority.json"
server_count = 9
# Une adresse par groupe, DANS L'ORDRE des --group-id 0-8 de docker-compose.yml : shard_addrs[i]
# doit être le service lancé avec `--group-id i`. Ces chaînes partent telles quelles dans
# `TcpStream::connect` côté Gateway.
#
# Noms de SERVICE, jamais d'IP : en Swarm le nom résout vers la VIP stable, alors que l'IP des
# tâches change à chaque redéploiement (cf. CLAUDE.md, incident cloudflared 2026-07-16).
#
# Avant le 2026-07-20 ce champ n'existait pas et le code fabriquait `format!("group-{i}")` — une
# chaîne sans port, rejetée par `TcpStream::connect` à tous les coups. Le Gateway n'ouvrait donc
# aucun lien shard et ne renvoyait aucun Snapshot : deux joueurs au même endroit ne se voyaient
# pas, sans un seul log. Si cette liste ne fait pas exactement `server_count` entrées, le Gateway
# refuse maintenant de démarrer.
shard_addrs = [
  "shard-a:27030",
  "shard-b:27031",
  "shard-c:27032",
  "shard-d:27033",
  "shard-e:27034",
  "shard-f:27035",
  "shard-g:27036",
  "shard-h:27037",
  "shard-i:27038",
]

[runtime.radius]
base = 25.0
moderator = 50.0
game_master = 75.0

[runtime.aoi]
visibility_radius = 100.0
