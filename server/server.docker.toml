format_version = 1

[identity]
id = "tessera-dev-01"
name = "Tessera Dev — Night City"
description = "Serveur de développement TesseraSynth (docker-compose, Gateway + 2 Shards)."
region = "EU"
language = "FR"
max_players = 16
tags = ["dev", "test"]
discord_url = ""
website_url = "https://tesserasynth.net"
required_modset = "0.1.0-dev10"
voice_required = false
# Playtest 2 (2026-07-13+) : auth ZITADEL réelle exigée au Join (JWT vérifié), et bascule vers
# PostgresStore (voir bin/gateway.rs) — nécessite TESSERA_POSTGRES_URL posée côté Dokploy.
public = true

[runtime]
whitelist = false
store_path = "/data/players.json"

[runtime.gateway]
listen_addr = "0.0.0.0:27020"
advertise_addr = "51.38.189.234:27020"

# Topologie d'autorité Voronoï (tools/authority-tessellation) : authority.json (copié à côté de
# ce manifeste) porte la géométrie des cellules ; server_count sélectionne le groupement
# assignment_patterns[N] de l'artefact (remplace l'ancien arbre de splits/shards).
[runtime.topology]
authority_artifact = "authority.json"
server_count = 2

[runtime.radius]
base = 25.0
moderator = 50.0
game_master = 75.0

[runtime.aoi]
visibility_radius = 100.0
