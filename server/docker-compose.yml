# docker-compose.yml — topologie réelle TesseraSynth (Gateway + 10 Shards + Postgres + Redis),
# miroir de server.docker.toml. Le manifeste est monté en volume, pas embarqué dans l'image.
#
# 10 shards (2026-07-14) : granularité maximale de l'artefact d'autorité Voronoï pour
# server_count = 10 (1 cellule par groupe, cf. commentaire --group-id du service shard-a
# ci-dessous). Topologie statique/froide — pas de re-sharding à chaud tant qu'un seul VPS est en
# jeu (voir §5.6/§7.5 de la roadmap production).
#
# ⚠️ Le jeu parle en UDP (port du Gateway), pas HTTP — pas de tunnel Cloudflare pour ce port,
# il doit être ouvert directement sur le pare-feu du serveur (voir server/README.md).
#
# directory/ reste un outil CLI ponctuel (publish/verify/topology) — pas de service ici ;
# invoqué à la demande, dans le MÊME réseau Docker que ce compose (sinon `gateway` n'est pas
# résoluble par nom) : `docker compose run --rm --entrypoint tessera-directory gateway
# publish --manifest /etc/tessera/server.toml` (ou `docker run --network <projet>_default ...`
# depuis un autre hôte du même déploiement). Voir TESSERA_INTERNAL_ATTESTATION_LISTEN sur le
# service `gateway` ci-dessous : l'attestation "serveur officiel" (2026-07-16) suit exactement
# le même pattern que les métriques (9100) — bindée sur toutes les interfaces DU CONTENEUR mais
# jamais publiée sur l'hôte (`ports:`), donc jointe par `directory` via `http://gateway:9090/...`
# (nom de service, pas loopback : `directory` tourne dans un conteneur séparé, dont le loopback
# n'est PAS celui de `gateway`). Piège vécu (2026-07-17) : le défaut Rust de
# TESSERA_INTERNAL_ATTESTATION_LISTEN est volontairement `127.0.0.1` (sûr hors Docker) — sans
# cette surcharge ici, `directory` ne joint jamais l'endpoint et AUCUN serveur n'est jamais
# republié "official", en silence (repli "community", jamais un crash).
#
# logging + mem_limit/cpus (chantier 4.5, audit 2026-07-03) : un Gateway verbeux ne doit pas
# remplir le disque du VPS, et un shard qui fuit la mémoire ne doit pas affamer les autres
# services du même hôte. Valeurs par défaut prudentes, ajustables par variable d'env sans
# toucher ce fichier.
#
# Postgres/Redis colocalisés (chantier échelle self-host, 2026-07-13) : à l'échelle visée
# (dizaine de joueurs simultanés en playtest), une instance managée dédiée par service serait un
# coût et une étape de config superflus. Les deux tournent donc comme conteneurs sœurs sur le
# même VPS, jamais exposés hors du réseau Docker interne (pas de `ports:` publié pour eux) — le
# Gateway leur parle par nom de service DNS Compose (`postgres`, `redis`), donc
# TESSERA_POSTGRES_URL/TESSERA_REDIS_URL n'ont plus besoin d'être renseignées manuellement (voir
# leurs valeurs par défaut dans le service `gateway` ci-dessous). Si le trafic dépasse un jour ce
# qu'une seule machine encaisse, migrer vers un Postgres/Redis managé reste un changement de ces
# deux URLs seules — rien d'autre à toucher.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  gateway:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: ${IMAGE_NAME:-tessera-server}:${IMAGE_TAG:-latest}
    # Si ce service utilise l'image GHCR pré-construite (plutôt que `build:` ci-dessus) : sans
    # ça, un redeploy réutilise l'image locale en cache et ne re-tire pas un `:latest` plus
    # récent (même symptôme vécu sur platform-api le 2026-07-05 : redeploys sans effet).
    pull_policy: always
    command: ["tessera-gateway", "--manifest", "/etc/tessera/server.toml"]
    restart: unless-stopped
    mem_limit: ${GATEWAY_MEM_LIMIT:-512m}
    cpus: ${GATEWAY_CPUS:-1.0}
    logging: *default-logging
    ports:
      - "27020:27020/udp"
      # Port 9100 (métriques Prometheus texte) volontairement NON publié : le pare-feu ufw du VPS
      # de production est inactif (tout serait exposé publiquement sans authentification). Reste
      # accessible depuis l'intérieur du réseau Docker (ex. un futur Prometheus interne).
      # Port 9090 (attestation "serveur officiel" interne) : même traitement, volontairement NON
      # publié — voir TESSERA_INTERNAL_ATTESTATION_LISTEN ci-dessous et le commentaire directory/
      # en tête de fichier.
      # ⚠️ Port 9103 (page de logs en direct, session-log-live-view 2026-07-18) : PUBLIÉ
      # délibérément, contrairement aux trois ports ci-dessus — pensé pour être ouvert dans un
      # navigateur pendant un playtest. AUCUNE authentification (décision explicite, cf. spec) :
      # le pare-feu ufw de ce VPS étant inactif, ce port est accessible à quiconque en connaît
      # l'adresse. Acceptable pour un playtest restreint (données non critiques : positions de
      # shard, IDs client) — À DURCIR (token ou équivalent) avant tout usage à plus large échelle.
      - "9103:9103"
    volumes:
      - ${MANIFEST_PATH:-./server.docker.toml}:/etc/tessera/server.toml:ro
      # `authority_artifact = "authority.json"` du manifeste est un chemin relatif résolu contre
      # le répertoire du manifeste (/etc/tessera/) — sans ce montage, le Gateway boucle en crash
      # au boot ("artefact d'autorité illisible", trouvé en test local 2026-07-14). Seul le
      # Gateway en a besoin (bin/shard.rs n'appelle jamais load_authority_topology).
      - ${AUTHORITY_ARTIFACT_PATH:-./authority.json}:/etc/tessera/authority.json:ro
      - tessera-players:/data
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      TESSERA_GATEWAY_METRICS_ADDR: "0.0.0.0:9100"
      TESSERA_SESSION_LOG_PATH: "/data/session.jsonl"
      TESSERA_GATEWAY_SESSIONLOG_ADDR: "0.0.0.0:9102"
      TESSERA_GATEWAY_SESSIONLOG_HTML_ADDR: "0.0.0.0:9103"
      # IP publique fixe du VPS dev/playtest — utilisée UNIQUEMENT pour construire le lien affiché
      # au boot ("logs de session en direct disponibles sur http://..."), jamais pour le bind
      # lui-même (qui reste 0.0.0.0 ci-dessus, sinon le conteneur n'écoute que sur cette IP et pas
      # sur le loopback/les autres interfaces internes). Sans cette variable, le message de boot
      # affichait littéralement "http://0.0.0.0:9103/" — techniquement correct comme adresse de
      # bind mais inutilisable tel quel dans un navigateur (trouvé en playtest, 2026-07-18). Codée
      # en dur temporairement (phase playtest, VPS unique à IP fixe) — à revoir en variable
      # d'environnement propre si un jour plusieurs VPS/DNS entrent en jeu.
      TESSERA_GATEWAY_SESSIONLOG_HTML_PUBLIC_HOST: "51.38.189.234"
      # Défaut Rust = 127.0.0.1 (sûr hors Docker) ; ici surchargé en 0.0.0.0 comme les métriques
      # ci-dessus — jamais publié via `ports:`, donc reste interne au réseau Docker. Sans cette
      # ligne, `directory` (conteneur séparé) ne peut jamais joindre `/internal/attestation` et
      # aucun serveur n'est jamais republié "official" (silencieux : repli "community").
      TESSERA_INTERNAL_ATTESTATION_LISTEN: "0.0.0.0:9090"
      # Vide par défaut (aucune attestation = ce serveur reste "community", jamais bloquant).
      # Positionner via l'environnement du déploiement (.env Dokploy / export), jamais en dur ici
      # (c'est un bearer — voir server/.env.example). Piège vécu (2026-07-17, trouvé en vérifiant
      # RÉELLEMENT ce compose plutôt qu'en le relisant) : documentée dans .env.example mais absente
      # d'ici, la variable n'atteignait JAMAIS le process, quelle que soit sa valeur côté Dokploy.
      TESSERA_OFFICIAL_ATTESTATION: ${TESSERA_OFFICIAL_ATTESTATION:-}
      # Vide par défaut (comportement inchangé) — comptes (display_name, séparés par virgule)
      # amorcés comme admins racine (toutes permissions, y compris le bypass anti-triche
      # vitesse/téléportation). Positionner via l'environnement du déploiement (.env / export),
      # pas en dur ici.
      TESSERA_ROOT_ADMINS: ${TESSERA_ROOT_ADMINS:-}
      # Playtest 2 (2026-07-09+) : désactivé. Le flag rend TOUT compte connecté admin racine
      # et contourne l'anti-triche (par design, pour staff/MJ). Avec auth réelle en place,
      # on veut tester l'anti-triche aussi, pas seulement l'auth. À ne réactiver que si
      # besoin d'un bypass de développement ultérieurement (ne jamais pour prod).
      TESSERA_PLAYTEST_ALL_ADMIN: "false"
      # Override OPTIONNEL de l'audience OIDC attendue au Join (serveur public). Le code épingle
      # déjà EN DUR le client_id du launcher officiel (DEFAULT_LAUNCHER_CLIENT_ID dans gateway.rs,
      # même statut que ZITADEL_JWKS_URL) — donc RIEN à poser pour le déploiement officiel
      # TesseraSynth, l'auth marche sans cette variable. Ne renseigner que pour un opérateur tiers
      # ayant sa propre app ZITADEL : la valeur doit alors être le client_id de SON app launcher
      # (= le claim `aud` de l'id_token qu'elle émet). Vide/absente = défaut hardcodé utilisé.
      # Voir docs/architecture/0010-launcher-oidc-audience-pinned.md.
      TESSERA_ZITADEL_LAUNCHER_CLIENT_ID: ${TESSERA_ZITADEL_LAUNCHER_CLIENT_ID:-}
      # TESSERA_REDIS_URL/TESSERA_POSTGRES_URL (surcharge directe, prioritaire) restent vides par
      # défaut ; sans ces variables ET sans runtime.postgres_url dans le manifeste, le Gateway
      # assemble lui-même l'URL Postgres depuis les composants TESSERA_PG_* ci-dessous (voir
      # manifest::resolve_postgres_url) — pointant par défaut vers le service `postgres`
      # colocalisé : aucune saisie d'URL complète requise pour un déploiement standard.
      TESSERA_REDIS_URL: ${TESSERA_REDIS_URL:-redis://redis:6379}
      TESSERA_POSTGRES_URL: ${TESSERA_POSTGRES_URL:-}
      TESSERA_PG_HOST: postgres
      TESSERA_PG_PORT: "5432"
      TESSERA_PG_USER: tessera
      TESSERA_PG_DATABASE: tessera
      # Partagé avec le service `postgres` (même variable, voir sa définition) — jamais exposé
      # hors du réseau Docker interne (Postgres colocalisé n'a pas de `ports:` publié).
      TESSERA_PG_PASSWORD: ${TESSERA_POSTGRES_PASSWORD:-tessera-dev-only-change-in-prod}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      shard-a:
        condition: service_started
      shard-b:
        condition: service_started
      shard-c:
        condition: service_started
      shard-d:
        condition: service_started
      shard-e:
        condition: service_started
      shard-f:
        condition: service_started
      shard-g:
        condition: service_started
      shard-h:
        condition: service_started
      shard-i:
        condition: service_started
      shard-j:
        condition: service_started

  # 10 shards = granularité maximale de l'artefact Voronoï pour `server_count = 10`
  # (`assignment_patterns["10"]` = 1 cellule par groupe, pas de fusion — vérifié via
  # `python3 -c "json.load(...)"` sur authority.json le 2026-07-14) : topologie **froide**,
  # figée au démarrage (§5.6/§7.5 — pas de re-sharding à chaud pour l'instant, inutile tant
  # qu'un seul VPS est en jeu). `--group-id <n>` = index dans `assignment_patterns["10"]`,
  # traçabilité/logging uniquement (le routage reste au Gateway, `ShardTopology::locate`).
  shard-a:
    image: ${IMAGE_NAME:-tessera-server}:${IMAGE_TAG:-latest}
    pull_policy: always
    command: ["tessera-shard", "0.0.0.0:27030", "--manifest", "/etc/tessera/server.toml", "--group-id", "0", "--metrics-addr", "0.0.0.0:9101"]
    restart: unless-stopped
    mem_limit: ${SHARD_MEM_LIMIT:-512m}
    cpus: ${SHARD_CPUS:-1.0}
    logging: *default-logging
    volumes:
      - ${MANIFEST_PATH:-./server.docker.toml}:/etc/tessera/server.toml:ro
    environment:
      RUST_LOG: ${RUST_LOG:-info}

  shard-b:
    image: ${IMAGE_NAME:-tessera-server}:${IMAGE_TAG:-latest}
    pull_policy: always
    command: ["tessera-shard", "0.0.0.0:27031", "--manifest", "/etc/tessera/server.toml", "--group-id", "1", "--metrics-addr", "0.0.0.0:9101"]
    restart: unless-stopped
    mem_limit: ${SHARD_MEM_LIMIT:-512m}
    cpus: ${SHARD_CPUS:-1.0}
    logging: *default-logging
    volumes:
      - ${MANIFEST_PATH:-./server.docker.toml}:/etc/tessera/server.toml:ro
    environment:
      RUST_LOG: ${RUST_LOG:-info}

  shard-c:
    image: ${IMAGE_NAME:-tessera-server}:${IMAGE_TAG:-latest}
    pull_policy: always
    command: ["tessera-shard", "0.0.0.0:27032", "--manifest", "/etc/tessera/server.toml", "--group-id", "2", "--metrics-addr", "0.0.0.0:9101"]
    restart: unless-stopped
    mem_limit: ${SHARD_MEM_LIMIT:-512m}
    cpus: ${SHARD_CPUS:-1.0}
    logging: *default-logging
    volumes:
      - ${MANIFEST_PATH:-./server.docker.toml}:/etc/tessera/server.toml:ro
    environment:
      RUST_LOG: ${RUST_LOG:-info}

  shard-d:
    image: ${IMAGE_NAME:-tessera-server}:${IMAGE_TAG:-latest}
    pull_policy: always
    command: ["tessera-shard", "0.0.0.0:27033", "--manifest", "/etc/tessera/server.toml", "--group-id", "3", "--metrics-addr", "0.0.0.0:9101"]
    restart: unless-stopped
    mem_limit: ${SHARD_MEM_LIMIT:-512m}
    cpus: ${SHARD_CPUS:-1.0}
    logging: *default-logging
    volumes:
      - ${MANIFEST_PATH:-./server.docker.toml}:/etc/tessera/server.toml:ro
    environment:
      RUST_LOG: ${RUST_LOG:-info}

  shard-e:
    image: ${IMAGE_NAME:-tessera-server}:${IMAGE_TAG:-latest}
    pull_policy: always
    command: ["tessera-shard", "0.0.0.0:27034", "--manifest", "/etc/tessera/server.toml", "--group-id", "4", "--metrics-addr", "0.0.0.0:9101"]
    restart: unless-stopped
    mem_limit: ${SHARD_MEM_LIMIT:-512m}
    cpus: ${SHARD_CPUS:-1.0}
    logging: *default-logging
    volumes:
      - ${MANIFEST_PATH:-./server.docker.toml}:/etc/tessera/server.toml:ro
    environment:
      RUST_LOG: ${RUST_LOG:-info}

  shard-f:
    image: ${IMAGE_NAME:-tessera-server}:${IMAGE_TAG:-latest}
    pull_policy: always
    command: ["tessera-shard", "0.0.0.0:27035", "--manifest", "/etc/tessera/server.toml", "--group-id", "5", "--metrics-addr", "0.0.0.0:9101"]
    restart: unless-stopped
    mem_limit: ${SHARD_MEM_LIMIT:-512m}
    cpus: ${SHARD_CPUS:-1.0}
    logging: *default-logging
    volumes:
      - ${MANIFEST_PATH:-./server.docker.toml}:/etc/tessera/server.toml:ro
    environment:
      RUST_LOG: ${RUST_LOG:-info}

  shard-g:
    image: ${IMAGE_NAME:-tessera-server}:${IMAGE_TAG:-latest}
    pull_policy: always
    command: ["tessera-shard", "0.0.0.0:27036", "--manifest", "/etc/tessera/server.toml", "--group-id", "6", "--metrics-addr", "0.0.0.0:9101"]
    restart: unless-stopped
    mem_limit: ${SHARD_MEM_LIMIT:-512m}
    cpus: ${SHARD_CPUS:-1.0}
    logging: *default-logging
    volumes:
      - ${MANIFEST_PATH:-./server.docker.toml}:/etc/tessera/server.toml:ro
    environment:
      RUST_LOG: ${RUST_LOG:-info}

  shard-h:
    image: ${IMAGE_NAME:-tessera-server}:${IMAGE_TAG:-latest}
    pull_policy: always
    command: ["tessera-shard", "0.0.0.0:27037", "--manifest", "/etc/tessera/server.toml", "--group-id", "7", "--metrics-addr", "0.0.0.0:9101"]
    restart: unless-stopped
    mem_limit: ${SHARD_MEM_LIMIT:-512m}
    cpus: ${SHARD_CPUS:-1.0}
    logging: *default-logging
    volumes:
      - ${MANIFEST_PATH:-./server.docker.toml}:/etc/tessera/server.toml:ro
    environment:
      RUST_LOG: ${RUST_LOG:-info}

  shard-i:
    image: ${IMAGE_NAME:-tessera-server}:${IMAGE_TAG:-latest}
    pull_policy: always
    command: ["tessera-shard", "0.0.0.0:27038", "--manifest", "/etc/tessera/server.toml", "--group-id", "8", "--metrics-addr", "0.0.0.0:9101"]
    restart: unless-stopped
    mem_limit: ${SHARD_MEM_LIMIT:-512m}
    cpus: ${SHARD_CPUS:-1.0}
    logging: *default-logging
    volumes:
      - ${MANIFEST_PATH:-./server.docker.toml}:/etc/tessera/server.toml:ro
    environment:
      RUST_LOG: ${RUST_LOG:-info}

  shard-j:
    image: ${IMAGE_NAME:-tessera-server}:${IMAGE_TAG:-latest}
    pull_policy: always
    command: ["tessera-shard", "0.0.0.0:27039", "--manifest", "/etc/tessera/server.toml", "--group-id", "9", "--metrics-addr", "0.0.0.0:9101"]
    restart: unless-stopped
    mem_limit: ${SHARD_MEM_LIMIT:-512m}
    cpus: ${SHARD_CPUS:-1.0}
    logging: *default-logging
    volumes:
      - ${MANIFEST_PATH:-./server.docker.toml}:/etc/tessera/server.toml:ro
    environment:
      RUST_LOG: ${RUST_LOG:-info}

  heartbeat:
    image: ${IMAGE_NAME:-tessera-server}:${IMAGE_TAG:-latest}
    pull_policy: always
    entrypoint: ["tessera-directory"]
    command: ["heartbeat",
              "--manifest", "/etc/tessera/server.toml",
              "--platform-url", "${PLATFORM_URL:-https://platform.tesserasynth.net}",
              "--identity-path", "/data/server_identity.b64",
              "--metrics-url", "http://gateway:9100"]
    restart: unless-stopped
    mem_limit: ${HEARTBEAT_MEM_LIMIT:-64m}
    cpus: ${HEARTBEAT_CPUS:-0.2}
    logging: *default-logging
    volumes:
      - ${MANIFEST_PATH:-./server.docker.toml}:/etc/tessera/server.toml:ro
      - tessera-players:/data
    depends_on:
      - gateway

  # Données joueur durables (PostgresStore, catégorie B du design stockage 2026-07-09) — voir
  # note en tête de fichier sur le choix de colocalisation. `POSTGRES_PASSWORD` doit rester
  # identique à `TESSERA_PG_PASSWORD`/`TESSERA_POSTGRES_PASSWORD` du service `gateway` (même
  # variable d'environnement `TESSERA_POSTGRES_PASSWORD` référencée aux deux endroits).
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEM_LIMIT:-256m}
    cpus: ${POSTGRES_CPUS:-0.5}
    logging: *default-logging
    # Pas de `ports:` : jamais exposé hors du réseau Docker interne, seul le Gateway (et les
    # migrations qu'il exécute lui-même au boot, voir bin/gateway.rs) s'y connecte.
    environment:
      POSTGRES_USER: tessera
      POSTGRES_DB: tessera
      POSTGRES_PASSWORD: ${TESSERA_POSTGRES_PASSWORD:-tessera-dev-only-change-in-prod}
    volumes:
      - tessera-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tessera -d tessera"]
      interval: 5s
      timeout: 5s
      retries: 10

  # État chaud (HotStateCache, catégorie A du design stockage 2026-07-09) — cache de reprise
  # rapide, jamais la source de vérité durable ; pas de volume nécessaire (une perte au redémarrage
  # dégrade la reprise, ne corrompt aucune donnée durable, cf. doc de module hot_state_cache.rs).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: ${REDIS_MEM_LIMIT:-128m}
    cpus: ${REDIS_CPUS:-0.3}
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Observabilité (Prometheus/Grafana/Alertmanager, sous-projet C, Task 6) ---
  # Scrape le Gateway sur son port métriques 9100 (non publié via `ports:`, mais joignable depuis
  # `prometheus` par nom de service DNS Compose sur le même réseau — voir observability/prometheus.yml).
  # Pas de `ports:` publié ici non plus par défaut : ce stack est pensé pour un accès interne
  # (port-forward SSH / VPN) plutôt qu'exposé publiquement comme le port 9103 (logs en direct) —
  # à revisiter explicitement si un accès public est un jour souhaité (mêmes réserves que 9103,
  # voir CLAUDE.md).
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - tessera-prometheus-data:/prometheus
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-256m}
    cpus: ${PROMETHEUS_CPUS:-0.5}

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      - GF_SECURITY_ADMIN_USER=${TESSERA_GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${TESSERA_GRAFANA_ADMIN_PASSWORD:?variable requise}
    volumes:
      - ./observability/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/tessera.json:ro
      - ./observability/grafana-datasource.yml:/etc/grafana/provisioning/datasources/tessera.yml:ro
      - tessera-grafana-data:/var/lib/grafana
    mem_limit: ${GRAFANA_MEM_LIMIT:-256m}
    cpus: ${GRAFANA_CPUS:-0.5}
    depends_on:
      - prometheus

  # ⚠️ Alertmanager NE substitue PAS lui-même `${VAR}` dans son propre YAML (pas d'interpolation
  # d'env var native — issue amont prometheus/alertmanager#2818, jamais mergée ; confirmé en local
  # le 2026-07-20 : lancé tel quel, le conteneur crash-loop avec `invalid URL: unsupported scheme
  # "" for URL`, `${TESSERA_ALERTMANAGER_DISCORD_WEBHOOK}` étant lu comme une URL littérale). Le
  # gabarit versionné est donc monté sous `alertmanager.yml.tmpl` (jamais directement au chemin
  # `--config.file` attendu), et l'entrypoint ci-dessous le substitue via `sed` (busybox, présent
  # dans cette image — pas de dépendance à `envsubst`/`gettext`, absent de l'image `prom/alertmanager`
  # de base, vérifié en local) vers un fichier généré dans le volume `/alertmanager` avant d'exec le
  # vrai binaire. Écarté : un proxy webhook tiers (`alertmanager-discord`) — ajoute un service et une
  # image externe pour un problème que `sed` résout en une ligne ici.
  alertmanager:
    image: prom/alertmanager:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      - TESSERA_ALERTMANAGER_DISCORD_WEBHOOK=${TESSERA_ALERTMANAGER_DISCORD_WEBHOOK:?variable requise}
    entrypoint: ["/bin/sh", "-c"]
    command:
      # `$$` (pas `$`) devant CHAQUE référence à la variable : Compose interpole lui-même tout
      # `${VAR}`/`$VAR` non échappé dans ce bloc AVANT de l'écrire dans le conteneur (piège trouvé
      # en local le 2026-07-20 — `docker compose config` montrait le webhook déjà en clair dans le
      # pattern sed côté hôte). `$$VAR` dans le YAML devient littéralement `$VAR` une fois passé
      # au conteneur, où c'est alors le shell QUI L'INTERPRÈTE (comportement voulu, une seule fois,
      # côté conteneur).
      - |
        set -e
        sed "s#\$${TESSERA_ALERTMANAGER_DISCORD_WEBHOOK}#$$TESSERA_ALERTMANAGER_DISCORD_WEBHOOK#g" \
          /etc/alertmanager/alertmanager.yml.tmpl > /alertmanager/alertmanager.yml
        exec /bin/alertmanager --config.file=/alertmanager/alertmanager.yml --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml.tmpl:ro
      - tessera-alertmanager-data:/alertmanager
    mem_limit: ${ALERTMANAGER_MEM_LIMIT:-128m}
    cpus: ${ALERTMANAGER_CPUS:-0.25}

volumes:
  tessera-players:
  tessera-postgres-data:
  tessera-prometheus-data:
  tessera-grafana-data:
  tessera-alertmanager-data:
