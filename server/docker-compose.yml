# docker-compose.yml — topologie réelle TesseraSynth (Gateway + 2 Shards + Postgres + Redis),
# miroir de server.docker.toml. Le manifeste est monté en volume, pas embarqué dans l'image.
#
# ⚠️ Le jeu parle en UDP (port du Gateway), pas HTTP — pas de tunnel Cloudflare pour ce port,
# il doit être ouvert directement sur le pare-feu du serveur (voir server/README.md).
#
# directory/ reste un outil CLI ponctuel (publish/verify/topology) — pas de service ici ;
# invoqué à la demande : `docker run --rm --entrypoint tessera-directory <image> ...`.
#
# logging + mem_limit/cpus (chantier 4.5, audit 2026-07-03) : un Gateway verbeux ne doit pas
# remplir le disque du VPS, et un shard qui fuit la mémoire ne doit pas affamer les autres
# services du même hôte. Valeurs par défaut prudentes, ajustables par variable d'env sans
# toucher ce fichier.
#
# Postgres/Redis colocalisés (chantier échelle self-host, 2026-07-13) : à l'échelle visée
# (dizaine de joueurs simultanés en playtest), une instance managée dédiée par service serait un
# coût et une étape de config superflus. Les deux tournent donc comme conteneurs sœurs sur le
# même VPS, jamais exposés hors du réseau Docker interne (pas de `ports:` publié pour eux) — le
# Gateway leur parle par nom de service DNS Compose (`postgres`, `redis`), donc
# TESSERA_POSTGRES_URL/TESSERA_REDIS_URL n'ont plus besoin d'être renseignées manuellement (voir
# leurs valeurs par défaut dans le service `gateway` ci-dessous). Si le trafic dépasse un jour ce
# qu'une seule machine encaisse, migrer vers un Postgres/Redis managé reste un changement de ces
# deux URLs seules — rien d'autre à toucher.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  gateway:
    build:
      context: ../..
      dockerfile: tessera-core/server/Dockerfile
    image: ${IMAGE_NAME:-tessera-server}:${IMAGE_TAG:-latest}
    # Si ce service utilise l'image GHCR pré-construite (plutôt que `build:` ci-dessus) : sans
    # ça, un redeploy réutilise l'image locale en cache et ne re-tire pas un `:latest` plus
    # récent (même symptôme vécu sur platform-api le 2026-07-05 : redeploys sans effet).
    pull_policy: always
    command: ["tessera-gateway", "--manifest", "/etc/tessera/server.toml"]
    restart: unless-stopped
    mem_limit: ${GATEWAY_MEM_LIMIT:-512m}
    cpus: ${GATEWAY_CPUS:-1.0}
    logging: *default-logging
    ports:
      - "27020:27020/udp"
      # Port 9100 (métriques Prometheus texte) volontairement NON publié : le pare-feu ufw du VPS
      # de production est inactif (tout serait exposé publiquement sans authentification). Reste
      # accessible depuis l'intérieur du réseau Docker (ex. un futur Prometheus interne).
    volumes:
      - ${MANIFEST_PATH:-./server.docker.toml}:/etc/tessera/server.toml:ro
      - tessera-players:/data
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      TESSERA_GATEWAY_METRICS_ADDR: "0.0.0.0:9100"
      TESSERA_SESSION_LOG_PATH: "/data/session.jsonl"
      TESSERA_GATEWAY_SESSIONLOG_ADDR: "0.0.0.0:9102"
      # Vide par défaut (comportement inchangé) — comptes (display_name, séparés par virgule)
      # amorcés comme admins racine (toutes permissions, y compris le bypass anti-triche
      # vitesse/téléportation). Positionner via l'environnement du déploiement (.env / export),
      # pas en dur ici.
      TESSERA_ROOT_ADMINS: ${TESSERA_ROOT_ADMINS:-}
      # Playtest 2 (2026-07-09+) : désactivé. Le flag rend TOUT compte connecté admin racine
      # et contourne l'anti-triche (par design, pour staff/MJ). Avec auth réelle en place,
      # on veut tester l'anti-triche aussi, pas seulement l'auth. À ne réactiver que si
      # besoin d'un bypass de développement ultérieurement (ne jamais pour prod).
      TESSERA_PLAYTEST_ALL_ADMIN: "false"
      # TESSERA_REDIS_URL/TESSERA_POSTGRES_URL (surcharge directe, prioritaire) restent vides par
      # défaut ; sans ces variables ET sans runtime.postgres_url dans le manifeste, le Gateway
      # assemble lui-même l'URL Postgres depuis les composants TESSERA_PG_* ci-dessous (voir
      # manifest::resolve_postgres_url) — pointant par défaut vers le service `postgres`
      # colocalisé : aucune saisie d'URL complète requise pour un déploiement standard.
      TESSERA_REDIS_URL: ${TESSERA_REDIS_URL:-redis://redis:6379}
      TESSERA_POSTGRES_URL: ${TESSERA_POSTGRES_URL:-}
      TESSERA_PG_HOST: postgres
      TESSERA_PG_PORT: "5432"
      TESSERA_PG_USER: tessera
      TESSERA_PG_DATABASE: tessera
      # Partagé avec le service `postgres` (même variable, voir sa définition) — jamais exposé
      # hors du réseau Docker interne (Postgres colocalisé n'a pas de `ports:` publié).
      TESSERA_PG_PASSWORD: ${TESSERA_POSTGRES_PASSWORD:-tessera-dev-only-change-in-prod}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      shard-a:
        condition: service_started
      shard-b:
        condition: service_started

  shard-a:
    image: ${IMAGE_NAME:-tessera-server}:${IMAGE_TAG:-latest}
    pull_policy: always
    command: ["tessera-shard", "0.0.0.0:27030", "--manifest", "/etc/tessera/server.toml", "--metrics-addr", "0.0.0.0:9101"]
    restart: unless-stopped
    mem_limit: ${SHARD_MEM_LIMIT:-512m}
    cpus: ${SHARD_CPUS:-1.0}
    logging: *default-logging
    volumes:
      - ${MANIFEST_PATH:-./server.docker.toml}:/etc/tessera/server.toml:ro
    environment:
      RUST_LOG: ${RUST_LOG:-info}

  shard-b:
    image: ${IMAGE_NAME:-tessera-server}:${IMAGE_TAG:-latest}
    pull_policy: always
    command: ["tessera-shard", "0.0.0.0:27031", "--manifest", "/etc/tessera/server.toml", "--metrics-addr", "0.0.0.0:9101"]
    restart: unless-stopped
    mem_limit: ${SHARD_MEM_LIMIT:-512m}
    cpus: ${SHARD_CPUS:-1.0}
    logging: *default-logging
    volumes:
      - ${MANIFEST_PATH:-./server.docker.toml}:/etc/tessera/server.toml:ro
    environment:
      RUST_LOG: ${RUST_LOG:-info}

  heartbeat:
    image: ${IMAGE_NAME:-tessera-server}:${IMAGE_TAG:-latest}
    pull_policy: always
    entrypoint: ["tessera-directory"]
    command: ["heartbeat",
              "--manifest", "/etc/tessera/server.toml",
              "--platform-url", "${PLATFORM_URL:-https://platform.tesserasynth.net}",
              "--identity-path", "/data/server_identity.b64",
              "--metrics-url", "http://gateway:9100"]
    restart: unless-stopped
    mem_limit: ${HEARTBEAT_MEM_LIMIT:-64m}
    cpus: ${HEARTBEAT_CPUS:-0.2}
    logging: *default-logging
    volumes:
      - ${MANIFEST_PATH:-./server.docker.toml}:/etc/tessera/server.toml:ro
      - tessera-players:/data
    depends_on:
      - gateway

  # Données joueur durables (PostgresStore, catégorie B du design stockage 2026-07-09) — voir
  # note en tête de fichier sur le choix de colocalisation. `POSTGRES_PASSWORD` doit rester
  # identique à `TESSERA_PG_PASSWORD`/`TESSERA_POSTGRES_PASSWORD` du service `gateway` (même
  # variable d'environnement `TESSERA_POSTGRES_PASSWORD` référencée aux deux endroits).
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEM_LIMIT:-256m}
    cpus: ${POSTGRES_CPUS:-0.5}
    logging: *default-logging
    # Pas de `ports:` : jamais exposé hors du réseau Docker interne, seul le Gateway (et les
    # migrations qu'il exécute lui-même au boot, voir bin/gateway.rs) s'y connecte.
    environment:
      POSTGRES_USER: tessera
      POSTGRES_DB: tessera
      POSTGRES_PASSWORD: ${TESSERA_POSTGRES_PASSWORD:-tessera-dev-only-change-in-prod}
    volumes:
      - tessera-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tessera -d tessera"]
      interval: 5s
      timeout: 5s
      retries: 10

  # État chaud (HotStateCache, catégorie A du design stockage 2026-07-09) — cache de reprise
  # rapide, jamais la source de vérité durable ; pas de volume nécessaire (une perte au redémarrage
  # dégrade la reprise, ne corrompt aucune donnée durable, cf. doc de module hot_state_cache.rs).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: ${REDIS_MEM_LIMIT:-128m}
    cpus: ${REDIS_CPUS:-0.3}
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tessera-players:
  tessera-postgres-data:
