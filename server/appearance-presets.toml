# Catalogue des PRESETS d'apparence joueur — modèle preset (décision Lucas 2026-07-25),
# CLASSÉ EN 3 CATÉGORIES RP (décision Lucas 2026-07-27) : corpo / gosse_des_rues / nomad.
#
# Contexte : le rendu d'un corps-joueur au visage EXACT exige une activation native non résolue
# (cf. docs/superpowers/specs/2026-07-25-synchro-apparence-compositionnelle-design.md §6.2).
# Chantier B1/B2 **MIS EN PAUSE le 2026-07-27** après une journée de RE qui a éliminé six pistes et
# abouti à un verrou data-driven (la scène pantin du miroir, cf. research/FINDINGS.md F-PLY-19→27).
# Le modèle preset devient donc la livraison, pas un pis-aller : chaque joueur choisit un avatar
# dans cette liste. C'est le repli R1 du registre de risques, assumé.
#
# Chaque preset = `base_record` (une entité NPC qui SE REND — prouvé en jeu) + `appearance` (variante
# ÉPINGLÉE). ⚠️ L'apparence d'un crowd record est ALÉATOIRE à chaque spawn (mesuré 2026-07-25) — d'où
# l'épinglage explicite, sinon deux joueurs du même preset auraient des looks différents.
#
# Flux : le serveur offre ces choix, tient le choix de chaque joueur, et l'émet en `AppearanceSync`
# (le fil porte `base_record`=hash TweakDBID + `appearance`=hash CName). Le client spawn `base_record`
# puis applique `appearance` (au spawn OU `ScheduleAppearanceChange`, tous deux prouvés en jeu).
#
# ─────────────────────────────────────────────────────────────────────────────────────────────
# LES 3 CATÉGORIES (taxonomie RP Tessera, décision du 2026-07-27)
#
#   corpo          — costards, argent, Night City d'en haut.
#   gosse_des_rues — la ville au ras du bitume : streetwear, débrouille, gangs urbains.
#   nomad          — hors-la-ville : nomades, Aldecaldos, bikers, Badlands.
#
# ⚠️ La 3ᵉ catégorie s'appelle `nomad` (nommage corrigé le 2026-07-27 — « fange » avait été
# employé un moment, puis écarté : le terme désignait pour moi le bas-fond urbain, ce qui
# classait les nomades à l'opposé. `nomad` ne prête pas à confusion).
#
# CIBLE : ~10 presets par catégorie (30 au total).
# ÉTAT : 11 vérifiés — corpo 6/10, nomad 4/10, **gosse_des_rues 1/10** (le gros trou).
#
# ─────────────────────────────────────────────────────────────────────────────────────────────
# INVARIANT DU FICHIER : tout preset listé ici a été VÉRIFIÉ EN JEU (spawn + rendu confirmé,
# apparence relue via `GetCurrentAppearanceName`). `verified = false` est toléré pour un candidat
# en attente de session — mais un preset non vérifié ne doit JAMAIS être proposé à un joueur : le
# rendu d'un crowd record n'est pas garanti (cf. F-PLY-01, un corps qui ne rend rien du tout).
#
# MÉTHODE POUR ÉTENDRE (leçon du preset 7) : le style ne vient PAS du nom du record mais du POOL
# D'APPARENCES. `Character.AsianMale` donne un look streetwear via `king_of_the_stoop_ma_*`.
#
# ✅ POOLS EXTRAITS le 2026-07-27 → `appearance-pools.json` (à côté de ce fichier) :
#    **2736 apparences** sur 47 archétypes, extraites des `.app` du jeu (WolvenKit) et classées :
#      corpo          659   (arasaka_corpo, corporat, rich)
#      gosse_des_rues 1866   (lowlife, junkie, homeless, mallrat, youngster, freak, nightlife,
#                             tenant, creole, workout, chubby, obese, nonbinary, default…)
#      nomad           211   (aldecaldos, biker)
#    Le trou `gosse_des_rues` est donc largement comblé côté matière première.
#
# RÈGLE DE NOMMAGE (vérifiée sur 3 presets existants) : le CName complet à mettre dans
# `appearance` = `<nom du fichier .app>_<nom de l'apparence>`.
#    `citizen__rich_wa` + `rich_17`          → `citizen__rich_wa_rich_17`        (preset 3)
#    `citizen__corporat_wa` + `corporat_wa_12` → `citizen__corporat_wa_corporat_wa_12` (preset 6)
#    `king_of_the_stoop_ma` + `king_of_the_stoop_ma_04` → celui du preset 7
#
# ⚠️ CONTRAINTE NON ENCORE LEVÉE : une apparence appartient au `.app` d'une entité donnée. On ne
# peut donc pas apparier n'importe quel `base_record` avec n'importe quelle apparence — il reste à
# établir la correspondance **record → fichier `.app`**. Le preset 7 le montre : `Character.AsianMale`
# est servi par `king_of_the_stoop_ma`, pas par un `citizen__asian_*`. À trancher avant de peupler
# le catalogue, sinon on écrira des paires qui ne rendront rien.
#
# La famille `Character.Citizen*` est limitée (Aldecaldos, Biker, Rich — vérifié sur le dump de
# 5155 records) : elle ne couvrira jamais `gosse_des_rues` à elle seule.

