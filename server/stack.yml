# stack.yml — serveur de jeu TesseraSynth, déployé par Dokploy (via `docker compose up`).
#
# On utilise une image DÉJÀ construite, publiée par le cloud sur GHCR (pas de build ici).
# ⚠️ L'image doit être PUBLIQUE sur GHCR, sinon le pull échoue en "unauthorized".
# Port 27020/udp publié directement (le jeu parle en UDP) — à ouvrir sur le pare-feu du VPS.

services:
  server:
    image: ghcr.io/the-genium007/tessera-server:latest
    restart: unless-stopped
    environment:
      RUST_LOG: info
    ports:
      - "27020:27020/udp"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
