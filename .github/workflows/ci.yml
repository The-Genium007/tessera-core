name: ci

# Inerte tant que ce fichier vit sous tessera-core/.github/workflows/ dans le monorepo
# privé Tessera (GitHub n'exécute que le .github/workflows/ à la racine d'un repo).
# Devient actif une fois publié à la racine du repo public tessera-core.

on:
  push:
    branches: [dev, playtest, main]
  pull_request:
    branches: [dev, playtest, main]

concurrency:
  group: tessera-core-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Postgres de test pour les `#[sqlx::test]` de `postgres_store.rs` (Task D1) et Redis de test
    # pour les tests de `hot_state_cache.rs` (Task D2) — même config que
    # tessera-core/../.github/workflows/server-image.yml du monorepo (ce fichier était resté sans
    # ces services, ce qui faisait échouer 13 tests ici alors qu'ils passent dans le monorepo).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Installer flatc (version exacte du crate flatbuffers, cf. server/Dockerfile)
        run: |
          curl -fsSL -o /tmp/flatc.zip \
            https://github.com/google/flatbuffers/releases/download/v25.12.19/Linux.flatc.binary.g++-13.zip
          echo "9f87066dc5dfa7fe02090b55bab5f3e55df03e32c9b0cdf229004ade7d091039  /tmp/flatc.zip" | sha256sum -c -
          sudo unzip -o /tmp/flatc.zip -d /usr/local/bin
          sudo chmod +x /usr/local/bin/flatc
          flatc --version
      - run: cargo build --workspace
      - run: cargo test --workspace
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings
