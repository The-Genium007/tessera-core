name: docker-image

# Inerte tant que ce fichier vit sous tessera-core/.github/workflows/ dans le monorepo
# privé Tessera. Devient actif une fois publié à la racine du repo public tessera-core.
#
# Construit et publie l'image serveur sur GHCR, taguée par branche (dev/playtest/stable).
# Ne déploie PAS automatiquement sur un serveur hébergé : aucune cible d'hébergement
# séparée pour dev/playtest n'est provisionnée à ce jour. Voir la section « Déploiement »
# de README.md pour la procédure manuelle.

on:
  push:
    branches: [dev, playtest, main]

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Déterminer le tag de canal (dev/playtest/stable)
        id: tag
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          case "$BRANCH" in
            main) echo "channel=stable" >> "$GITHUB_OUTPUT" ;;
            *) echo "channel=$BRANCH" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ghcr.io/the-genium007/tessera-server:${{ steps.tag.outputs.channel }}
            ghcr.io/the-genium007/tessera-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
