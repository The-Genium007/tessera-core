name: docker-image

# Inerte tant que ce fichier vit sous tessera-core/.github/workflows/ dans le monorepo
# privé Tessera. Devient actif une fois publié à la racine du repo public tessera-core.
#
# Construit et publie l'image serveur sur GHCR, taguée par branche (dev/playtest/stable).
# Package `tessera-core` (pas `tessera-server`, déjà utilisé par le pipeline interne de
# Tessera) : un package GHCR est lié au premier repo qui le publie, donc un nom distinct
# évite un permission_denied: write_package quand tessera-core essaie de pousser dessus.
# Ne déploie PAS automatiquement sur un serveur hébergé : aucune cible d'hébergement
# séparée pour dev/playtest n'est provisionnée à ce jour. Voir la section « Déploiement »
# de README.md pour la procédure manuelle.

on:
  push:
    branches: [dev, playtest, main]

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Déterminer le tag de canal (dev/playtest/stable)
        id: tag
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          case "$BRANCH" in
            main) echo "channel=stable" >> "$GITHUB_OUTPUT" ;;
            *) echo "channel=$BRANCH" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ghcr.io/the-genium007/tessera-core:${{ steps.tag.outputs.channel }}
            ghcr.io/the-genium007/tessera-core:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
